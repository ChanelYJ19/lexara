[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexara"
version = "0.1.0"
description = "Lexara Reading Level & Rewrite API + Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Lexara" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Real providers live behind optional extras so the core install stays light.
openai = ["openai>=1.30"]

[project.scripts]
lexara-api = "lexara.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/lexara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: live provider tests (require LEXARA_OPENAI_API_KEY)",
]
